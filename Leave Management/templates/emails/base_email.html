<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
        }

        .container {
            max-width: 600px;
            margin: 20px auto;
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .header {
            background: #0f172a;
            padding: 35px 30px;
            text-align: center;
            color: #ffffff;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 1px;
            font-weight: 300;
        }

        .header span {
            color: #38bdf8;
            font-weight: 700;
        }

        .content {
            padding: 40px;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .status-approved {
            background: #dcfce7;
            color: #166534;
        }

        .status-rejected {
            background: #fee2e2;
            color: #991b1b;
        }

        .status-pending {
            background: #fef9c3;
            color: #854d0e;
        }

        .status-updated {
            background: #e0f2fe;
            color: #075985;
        }

        .details-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }

        .details-row {
            margin-bottom: 10px;
            display: flex;
        }

        .details-label {
            font-weight: 600;
            color: #64748b;
            width: 100px;
        }

        .details-value {
            color: #1e293b;
            flex: 1;
        }

        .button {
            display: inline-block;
            padding: 14px 28px;
            background-color: #0f172a;
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            margin-top: 20px;
        }

        .footer {
            background: #f1f5f9;
            padding: 30px;
            text-align: center;
            color: #64748b;
            font-size: 13px;
            border-top: 1px solid #e2e8f0;
        }

        .footer a {
            color: #38bdf8;
            text-decoration: none;
        }

        .decorated-line {
            border: none;
            border-top: 1px dashed #cbd5e1;
            margin: 20px 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <table width="100%" cellspacing="0" cellpadding="0" style="border-collapse: collapse;">
                <tr>
                    <td align="center">
                        <img src="cid:logo_image" alt="Logo"
                            style="height: 45px; width: auto; vertical-align: middle;">
                        <span style="font-size: 36px; color: #ffffff; font-weight: bold; font-family: 'Arial Black', Gadget, sans-serif; vertical-align: middle; margin-left: 15px; letter-spacing: 1px;">MS <span style="font-weight: bold; color: #38bdf8;">TECHNOLOGY</span></span>
                        <p style="margin: 8px 0 0 0; font-size: 14px; opacity: 0.8;">Leave Management Portal</p>
                    </td>
                </tr>
            </table>
        </div>
        <div class="content">
            {% block content %}{% endblock %}

            <a href="{{ portal_link }}" class="button">Go to Portal</a>
        </div>
        <div class="footer">
            <div class="decorated-line"></div>
            <p><strong>🌐 MS TECHNOLOGY PORTAL</strong></p>
            <p>For more details, visit: <a href="{{ portal_link }}">{{ portal_link }}</a></p>
            <p style="font-size: 11px; margin-top: 20px;">This is an automated message. Please do not reply directly to
                this address unless specified.</p>
        </div>
    </div>
</body>

</html>
