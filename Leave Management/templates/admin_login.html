{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <link rel="stylesheet" href="{% static 'css/common_login.css' %}">
</head>
<body>

<div class="login-box">
    <h2>Admin Login</h2>

    <form method="post">
        {% csrf_token %}
        <label>User-Name</label>
        <input type="text" name="username" placeholder="Enter your Username" required>

        <label>Password</label>
        <input type="password" name="password" placeholder="Enter password" required>

        <button style="background:#e74c3c;">Login</button>
    </form>

    <div class="back-link">
        <a href="{% url 'role_select' %}">← Back</a>
    </div>
</div>

</body>
</html>
