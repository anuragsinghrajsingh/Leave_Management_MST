upstream leave_app {
    server web:8000;
}

server {
    listen 80;
    server_name localhost; # Replace with your company domain/IP

    client_max_body_size 20M;

    location / {
        proxy_pass http://leave_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }
}
